name = "ai-budget-firewall"
main = "src/index.js"
compatibility_date = "2026-01-31"
account_id = "9b9bf8a6fc6837d8f29fa0d325f30116"

# Bind the production KV namespace used by earlier deployments
kv_namespaces = [
  { binding = "BUDGET_KV", id = "cd8c7d7a4bdd446abe154eef07926b72" }
]

[env.preview]
  workers_dev = true
  name = "ai-budget-firewall-preview"

  # KV namespace binding (wrangler will attempt to use existing or create a namespace if allowed)
  kv_namespaces = [
    { binding = "BUDGET_KV", id = "3f0eddb4096f41ef8f0f812e52df1df0" }
  ]

  # Durable Object binding: class_name must match the exported class in src/budget_do.js
  [env.preview.durable_objects]
  bindings = [
    { name = "BUDGET_DO", class_name = "BudgetCounter" }
  ]

[[migrations]]
  tag = "v1"
  new_sqlite_classes = ["BudgetCounter"]

