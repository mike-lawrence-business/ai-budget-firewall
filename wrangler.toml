name = "ai-budget-firewall"
main = "src/index.js"
compatibility_date = "2023-12-01"

# KV namespace for pricing table, limits, and audit entries
[[kv_namespaces]]
binding = "BUDGET_KV"
id = "cd8c7d7a4bdd446abe154eef07926b72"

[durable_objects]
bindings = [
  { name = "BUDGET_DO", class_name = "BudgetCounter" }
]

# Optional environment/static configuration
[vars]
# Default daily budget in USD (can be overridden per-budget via KV key limit:<budgetId> or the X-Budget-Limit header)
DAILY_BUDGET = "0"
