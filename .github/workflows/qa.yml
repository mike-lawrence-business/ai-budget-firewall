name: QA Smoke

on:
  push:
    branches: [ feature/durable-budgeting ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run local tests and sequential DO test
        run: |
          node test/local_test.js
          node test/test_do_serial.mjs
